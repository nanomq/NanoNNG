# NanoNNG Zephyr MQTT Client Demo Configuration
#
# Requires TCP networking for broker connection.

# POSIX API — provides pthread, sockets, poll
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=32
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=16
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y

# Networking — TCP for broker connection
# QEMU User Networking (SLIRP): built-in NAT, no host setup needed
# Zephyr IP: 10.0.2.15, gateway: 10.0.2.2 (host)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_QEMU_USER=y

# Static IP config (avoid DHCP dependency at startup)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="10.0.2.2"

# DNS resolution — QEMU User Networking SLIRP DNS proxy at 10.0.2.3
# (10.0.2.2 is the host, which typically has no DNS listener)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_SERVER1="10.0.2.3"
CONFIG_DNS_SERVER2="8.8.8.8"

# Memory and stack sizing
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=16384

# Networking buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Debug output
CONFIG_PRINTK=y