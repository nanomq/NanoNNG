# NanoNNG Zephyr MQTT Demo — common configuration
#
# Board-specific settings (IP, DNS, networking mode) are in
# boards/<BOARD>.conf and loaded automatically by the Zephyr build system.

# POSIX API — provides pthread, sockets, poll
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=128
CONFIG_MAX_PTHREAD_COND_COUNT=64
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=32
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y

# Networking — TCP for broker connection
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# DNS resolution (broker.emqx.io hostname → IP)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2

# Memory and stack sizing
# MQTT requires more heap: CONNECT/CONNACK/SUBSCRIBE/SUBACK messages
# plus payload buffers.  256 KB gives enough headroom for the
# connection handshake + async recv/send pipeline.
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=16384

# Enable FPU so the SSE/SSE2/SSE3/SSSE3 Kconfig options become visible.
# Without FPU=y, the X86_SSE* options are hidden (guarded by "if FPU || X86_64").
CONFIG_FPU=y

# Enable SSE/SSE2/SSE3/SSSE3 in QEMU virtual CPU.
# The qemu_x86 board defaults to "-cpu qemu32" (Pentium II class) and
# only adds these features when the corresponding Kconfig options are on.
# Without them, any SSE2+ instruction emitted by the compiler causes #UD.
CONFIG_X86_SSE=y
CONFIG_X86_SSE2=y
CONFIG_X86_SSE3=y
CONFIG_X86_SSSE3=y

# Networking buffers — bumped for MQTT packet handling
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48

# Debug output
CONFIG_PRINTK=y
