# mps2_an385 — ARM Cortex-M3 on MPS2 FPGA platform (4MB SRAM)
#
# Unlike qemu_cortex_m3 (TI LM3S6965, 64KB), this board has ample RAM
# for NanoNNG with pthread-mutex atomic fallback.

# Use test entropy (no hardware RNG on MPS2 QEMU)
CONFIG_TEST_RANDOM_GENERATOR=y

# Disable SLIP networking (inproc demo doesn't need QEMU SLIP/TAP)
CONFIG_SLIP=n

# 32-bit ARM Cortex-M3 has no native 64-bit atomics.
# nanonng_external.cmake detects CONFIG_ARM && !CONFIG_64BIT and
# passes -DNNG_ZEPHYR_NO_STDATOMIC=ON for pthread-mutex fallback.
# The mutex fallback uses a pthread_mutex per atomic struct, so we
# need more mutex slots than the default 64.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=128
