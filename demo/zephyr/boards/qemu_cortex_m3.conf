# Cortex-M3 (TI LM3S6965) has only 64KB RAM — use minimal config
# Disable SLIP networking (inproc demo doesn't need QEMU SLIP pipe)
CONFIG_SLIP=n
CONFIG_HEAP_MEM_POOL_SIZE=20480
CONFIG_MAIN_STACK_SIZE=4096
# Minimal networking buffers (headers needed, runtime not used by inproc)
CONFIG_NET_PKT_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=4
# Minimal POSIX threading config
CONFIG_POSIX_THREAD_THREADS_MAX=4
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=8
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=4
CONFIG_DYNAMIC_THREAD_STACK_SIZE=6144
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2
CONFIG_HEAP_MEM_POOL_SIZE=24576
# Use test entropy (no hardware RNG on Cortex-M3 QEMU)
CONFIG_TEST_RANDOM_GENERATOR=y
