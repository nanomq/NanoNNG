# Larger heap and stack for host simulation
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_MAIN_STACK_SIZE=32768
# Required for DYNAMIC_THREAD on native_sim (not auto-selected by POSIX arch)
CONFIG_THREAD_STACK_INFO=y
# Pre-allocate thread stack pool (heap alloc fails on native_sim POSIX arch)
# Need at least 6: pollq(1) + taskq(2) + reap(1) + expire(1) + resolver(1)
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=8
# Larger dynamic thread stack for native_sim
CONFIG_DYNAMIC_THREAD_STACK_SIZE=32768
