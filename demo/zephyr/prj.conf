# NanoNNG Zephyr Inproc Demo — common configuration
#
# Board-specific settings (SLIP, heap size, etc.) are in boards/<BOARD>.conf
# and loaded automatically by the Zephyr build system.

# POSIX API — provides pthread, sockets (via BSD), poll
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=64
CONFIG_MAX_PTHREAD_COND_COUNT=32
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=32
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y

# Networking (required by NanoNNG internal headers; inproc transport
# does not use the network stack at runtime)
CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y

# Memory and stack sizing
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=16384

# Networking buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Debug output
CONFIG_PRINTK=y
