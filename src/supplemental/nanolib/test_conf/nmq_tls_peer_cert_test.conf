	bind = "0.0.0.0:8883"
	verify_peer = true
	fail_if_no_peer_cert = true
	peer_cert_as_username = cn
}

listeners.ssl.by_dn {
	bind = "0.0.0.0:8884"
	verify_peer = true
	fail_if_no_peer_cert = true
	peer_cert_as_username = DN
}

listeners.ssl.unset {
	bind = "0.0.0.0:8885"
}
