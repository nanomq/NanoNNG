# Exchange client configuration used by conf_test.c to cover exchange node
# validation. Only one block survives parsing:
#   - "no_name" has no exchange.name, so the node has no identity to address
#     it by and is dropped.
#   - "duplicate" reuses the first block's exchange name. Which of the two is
#     kept depends on the order the parser walks the blocks, so both carry the
#     same name and topic and the test asserts the outcome, not the order.

exchange_client.good {
	exchange_url = "tcp://127.0.0.1:10000"
	limit_frequency = 5

	exchange {
		topic = "e2e/good"
		name = "good_node"
		streamType = 0
		ringbus {
			name = "rb_good"
			cap = 10
			fullOp = 2
		}
		parquet {
			compress = "none"
			dir = "/tmp/nanomq-exchange-test"
			file_name_prefix = "exchange"
			file_count = 5
			file_size = 10MB
		}
	}
}

exchange_client.no_name {
	exchange_url = "tcp://127.0.0.1:10001"

	exchange {
		topic = "e2e/no_name"
		streamType = 0
		ringbus {
			name = "rb_no_name"
			cap = 10
			fullOp = 2
		}
	}
}

exchange_client.duplicate {
	exchange_url = "tcp://127.0.0.1:10002"

	exchange {
		topic = "e2e/good"
		name = "good_node"
		streamType = 0
		ringbus {
			name = "rb_duplicate"
			cap = 10
			fullOp = 2
		}
	}
}
