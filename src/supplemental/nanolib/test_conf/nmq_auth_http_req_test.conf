# Both requests point at a closed port: a request that is sent fails, and
# the publish is denied. Used by auth_http_test.
auth {
	http_auth = {
		super_req {
			url = "http://127.0.0.1:1/mqtt/superuser"
			method = "post"
			params = {clientid = "%c", username = "%u"}
		}

		acl_req {
			url = "http://127.0.0.1:1/mqtt/acl"
			method = "post"
			params = {clientid = "%c", access = "%A", topic = "%t"}
		}

		timeout = 1s
		connect_timeout = 1s
	}
}
