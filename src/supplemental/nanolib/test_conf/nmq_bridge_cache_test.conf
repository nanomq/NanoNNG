# Fixture for the per-Bridge-Node Bridge Cache tests (conf_test.c).
# Covers: defaults inheritance, whole-block override, enable implication,
# explicit disable, and the fact that a node-level `sqlite { }` is not an alias.

listeners.tcp {
    bind = "127.0.0.1:1883"
}

log {
    to = [console]
    level = error
}

# Bridge Cache Defaults
bridges.mqtt.cache {
    disk_cache_size = 4096
    mounted_file_path = "/tmp/nmq_bridge_cache_defaults/"
    flush_mem_threshold = 7
    resend_interval = 1234
}

# Inherits the defaults verbatim.
bridges.mqtt.inherits {
    server = "mqtt-tcp://127.0.0.1:1883"
    forwards = [ { local_topic = "in/a", remote_topic = "out/a", qos = 1 } ]
}

# Declares its own block: whole-block override, the omitted fields fall back to
# the type defaults (not to the block above).
bridges.mqtt.overrides {
    server = "mqtt-tcp://127.0.0.1:1883"
    cache {
        disk_cache_size = 32
        mounted_file_path = "/tmp/nmq_bridge_cache_overrides/"
    }
    forwards = [ { local_topic = "in/b", remote_topic = "out/b", qos = 1 } ]
}

# Presence implies enable, but an explicit enable = false wins.
bridges.mqtt.disabled {
    server = "mqtt-tcp://127.0.0.1:1883"
    cache {
        enable = false
    }
    forwards = [ { local_topic = "in/c", remote_topic = "out/c", qos = 1 } ]
}

# `sqlite { }` at node level is NOT an alias for `cache { }`: it must be
# ignored and the node must inherit the defaults.
bridges.mqtt.noalias {
    server = "mqtt-tcp://127.0.0.1:1883"
    sqlite {
        disk_cache_size = 999
    }
    forwards = [ { local_topic = "in/d", remote_topic = "out/d", qos = 1 } ]
}
