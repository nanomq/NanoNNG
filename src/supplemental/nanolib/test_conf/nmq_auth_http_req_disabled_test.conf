# Same requests as nmq_auth_http_req_test.conf, each turned off with
# `enable = false`: none is sent, and the publish is allowed. Used by
# auth_http_test.
auth {
	http_auth = {
		super_req {
			enable = false
			url = "http://127.0.0.1:1/mqtt/superuser"
			method = "post"
			params = {clientid = "%c", username = "%u"}
		}

		acl_req {
			enable = false
			url = "http://127.0.0.1:1/mqtt/acl"
			method = "post"
			params = {clientid = "%c", access = "%A", topic = "%t"}
		}

		timeout = 1s
		connect_timeout = 1s
	}
}
