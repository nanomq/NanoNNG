name: coverage
on: [push]
permissions:
  contents: read
jobs:

  linux-coverage:
    name: linux
    runs-on: [ ubuntu-latest ]
    steps:
    - name: Check out code
      uses: actions/checkout@v1

    - name: Install mbedTLS
      run: sudo apt-get install libmbedtls-dev

    - name: Install ninja
      run: sudo apt-get install ninja-build

    - name: Configure
      run:  mkdir build && cd build && cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON ..

    - name: build
      run: cd build && ninja

    - name: Test
      run: cd build && ctest --output-on-failure

    - name: Upload report
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        yml: ./.codecov.yml

  darwin-coverage:
    name: darwin
    runs-on: [ macos-latest ]
    steps:
      - name: Check out code
        uses: actions/checkout@v1

      - name: Install mbedTLS
        # Homebrew's mbedtls formula is now 4.x, whose CMake config package no
        # longer provides the MbedTLS::mbedcrypto target and whose headers
        # removed ctr_drbg.h/entropy.h (source is not yet 4.x compatible).
        run: brew install mbedtls@3

      - name: Install ninja
        run: brew install ninja

      - name: Configure
        run:  mkdir build && cd build && cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNNG_ENABLE_COVERAGE=ON -DNNG_ENABLE_TLS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix mbedtls@3)" ..

      - name: build
        run: cd build && ninja

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Upload report
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          yml: ./.codecov.yml
